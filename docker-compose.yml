services:
  postgres:
    image: postgres:18-alpine
    container_name: pg-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "15432:5432"
    volumes:
      - pg-local-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak-local
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import

  # トレースの確認用。既定では起動しない
  #   docker compose --profile otel up -d
  jaeger:
    # v1 の all-in-one は 2025年末で EOL。v2 を使う
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP 受信
    profiles:
      - otel

  # 負荷テスト（7.9・7.10節）。既定では起動しない。
  #   docker compose --profile load run --rm k6 run /scripts/scenarios/smoke.js
  k6:
    image: grafana/k6:2.2.0
    container_name: k6-local
    # ROPG の IDP_* など、下の environment に無いものはここから読む。
    # ファイルが無くても起動する（required: false）。
    env_file:
      - path: ./tests/load/.env
        required: false
    environment:
      # コンテナから見たホストのバックエンド。
      # localhost だと k6 コンテナ自身を指してしまう。
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3000}
      SKIP_AUTH: ${SKIP_AUTH:-true}
      # 本番ガードの解除。ここで受け取らないと、シェルで設定しても
      # コンテナの中に届かない。
      ALLOW_PROD: ${ALLOW_PROD:-}
    extra_hosts:
      # Docker Desktop 以外（Linux の docker engine）では自動解決されないため明示する
      - "host.docker.internal:host-gateway"
    volumes:
      - ./tests/load:/scripts:ro
    profiles:
      - load

volumes:
  pg-local-data:
  keycloak-data:
